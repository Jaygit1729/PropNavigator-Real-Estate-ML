[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers

# The project root must be importable so `from src...` and `from api...` work
# when pytest is invoked from anywhere (including CI).
pythonpath = .

filterwarnings =
    # LightGBM receives a numpy array from the ColumnTransformer, so it warns that
    # feature names are absent. Harmless — column ORDER is asserted in the tests.
    ignore:X does not have valid feature names:UserWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
