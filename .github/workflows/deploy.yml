name: Build and publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Hugging Face CLI
        run: pip install huggingface_hub==2.4.0

      - name: Download model and app data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >
          hf download Jay1729/propnavigator-artifacts
          --include "artifacts/*"
          --include "data/*"
          --local-dir .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/jaygit1729/propnavigator-api:latest
            ghcr.io/jaygit1729/propnavigator-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.streamlit
          push: true
          tags: |
            ghcr.io/jaygit1729/propnavigator-web:latest
            ghcr.io/jaygit1729/propnavigator-web:${{ github.sha }}
